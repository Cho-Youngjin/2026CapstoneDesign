spring:
  # server/.env가 있으면 자바 프로퍼티 형식(KEY=VALUE)으로 읽어와 아래 ${...} 값들을 채운다.
  # optional: 파일이 없어도(CI, 팀원 최초 클론 등) 부팅에 실패하지 않는다. .env 자체는 .gitignore 대상.
  config:
    import: optional:file:.env[.properties]
  application:
    name: travel-footsteps-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travelfootsteps}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # 채팅 사진 업로드 한도(Plan D Task 6). 파일 하나 5MB, 요청 전체 6MB(파일 외 부분 여유). 넘으면 413.
  # 배포 때 앞단 Nginx의 client_max_body_size(기본 1MB)도 6m 이상으로 올려야 한다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# 채팅 사진을 저장할 디렉터리(LocalDiskChatImageStorage). 배포 때는 VM의 영구 디스크 경로를 넣는다.
chat:
  image-dir: ${CHAT_IMAGE_DIR:./data/chat-images}

firebase:
  service-account-path: classpath:firebase-service-account.json

data-go-kr:
  service-key: ${DATA_GO_KR_SERVICE_KEY:}

google:
  server-api-key: ${GOOGLE_SERVER_API_KEY:}

korea-exim:
  api-key: ${KOREA_EXIM_API_KEY:}

# 발걸음 도로 스냅/해외 매핑용 OSRM 인스턴스(osrm/ 디렉터리, 국가별로 별도 인스턴스).
# 주소를 비워 두면 해당 국가는 미지원으로 취급해 요청이 ok:false(스냅은 원본 좌표 반환)로 끝난다.
osrm:
  profile: ${OSRM_PROFILE:foot}
  base-urls:
    KR: ${OSRM_BASE_URL:}
    JP: ${OSRM_BASE_URL_JP:}

server:
  port: 8080

logging:
  level:
    com.travelfootsteps: DEBUG
