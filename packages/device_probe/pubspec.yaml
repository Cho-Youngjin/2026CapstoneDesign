name: device_probe
description: 배터리 전하량·기기 정보를 읽는 앱 전용 Android 플러그인. 기록 서비스 isolate에서도 동작한다.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 생성된 analysis_options.yaml이 flutter_lints를 include한다.
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.travelfootsteps.device_probe
        pluginClass: DeviceProbePlugin
